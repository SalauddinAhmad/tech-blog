# ═══════════════════════════════════════════════════════════════
# 🇧🇩 Tech Intelligence বাংলা — বাংলা ব্লগ (পুরো সাইট বাংলায়)
# Hugo + PaperMod + SEO — https://salauddinahmad.github.io/tech-blog/
# ═══════════════════════════════════════════════════════════════

baseURL = "https://salauddinahmad.github.io/tech-blog/"
title = "Tech Intelligence বাংলা"
theme = "hugo-papermod"
[pagination]
pagerSize = 10
languageCode = "bn"
defaultContentLanguage = "bn"

[languages]
  [languages.bn]
    languageCode = "bn"
    title = "Tech Intelligence বাংলা"
    weight = 1

# ── SEO ──
enableRobotsTXT = true
enableEmoji = true
summaryLength = 30

[outputs]
  home = ["HTML", "RSS", "JSON"]
  page = ["HTML"]
  section = ["HTML", "RSS"]

[sitemap]
  changefreq = "daily"
  priority = 0.8
  filename = "sitemap.xml"

[params]
  mainSections = ["posts"]
  env = "production"
  description = "প্রতিদিনের Tech Intelligence ও Adaptability রিপোর্ট — বাংলায়, ইমেজ সহ অটো-পাবলিশ।"
  author = "Salauddin Ahmad"
  ShowReadingTime = false
  ShowShareButtons = true
  ShowPostNavLinks = true
  ShowBreadCrumbs = true
  ShowCodeCopyButtons = true
  ShowToc = true
  ShowWordCount = false
  ShowRssButtonInSectionTermList = true
  ShowFullTextinRSS = true
  ShowLastModified = true
  UseHugoToc = true
  hideAuthor = true
  dateFormat = "2 Jan 2006"
  hideFooter = false

  [params.homeInfoParams]
    Title = "সর্বশেষ খবর"
    Content = "প্রতিদিনের প্রযুক্তি বিশ্লেষণ ও পরিবর্তনশীল বিশ্বের সাথে তাল মেলানোর গাইড — সম্পূর্ণ বাংলায়"

  [params.profileMode]
    enabled = false
    title = "Salauddin Ahmad"
    subtitle = "Fullstack Developer & Tech Analyst"
    imageUrl = "/images/profile.jpg"

  [params.social]
    github = "https://github.com/SalauddinAhmad"

[menu]
  [[menu.main]]
    name = "হোম"
    url = "/"
    weight = 1
  [[menu.main]]
    name = "টেক ইন্টেলিজেন্স"
    url = "/categories/tech-intelligence/"
    weight = 2
  [[menu.main]]
    name = "অ্যাডাপ্টাবিলিটি"
    url = "/categories/adaptability/"
    weight = 3
  [[menu.main]]
    name = "English ব্লগ"
    url = "https://salauddinahmad.github.io/tech-blog-en/"
    weight = 4

[taxonomies]
  category = "categories"
  tag = "tags"

[services.rssHub]
  [services.rssHub.hub]
    type = "pubsubhubbub"
    url = "https://pubsubhubbub.superfeedr.com/"
